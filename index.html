<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My First HTML Page</title>
    <style>
      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #f4f7fb, #dfeafc);
        color: #1f2937;
      }

      .container {
        width: min(900px, 90%);
        margin: 80px auto;
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.12);
        padding: 40px;
      }

      h1 {
        font-size: 2.4rem;
        margin-bottom: 12px;
        color: #111827;
      }

      p {
        font-size: 1.05rem;
        line-height: 1.7;
        color: #4b5563;
      }

      .button {
        display: inline-block;
        margin-top: 18px;
        padding: 12px 22px;
        background: #2563eb;
        color: white;
        border-radius: 10px;
        text-decoration: none;
        font-weight: bold;
        transition: background 0.2s ease;
      }

      .button:hover {
        background: #1d4ed8;
      }

      .info {
        margin-top: 30px;
        padding: 18px 20px;
        background: #eff6ff;
        border-left: 5px solid #3b82f6;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Hello, World!</h1>
      <p>
        This is a simple HTML page created in the project folder. You can edit the content
        here to build your own website or landing page.
      </p>

      <a href="#" class="button">Click Me</a>

      <div class="info">
        <strong>Note:</strong> You can replace this content with your own text, images, and CSS.
      </div>
    </div>
  </body>
</html>
