<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Md Abul HasnaT | Personal Website</title>
    <style>
      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #f4f7fb, #dfeafc);
        color: #1f2937;
      }

      .container {
        width: min(900px, 90%);
        margin: 80px auto;
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.12);
        padding: 40px;
      }

      h1 {
        font-size: 2.4rem;
        margin-bottom: 12px;
        color: #111827;
      }

      p {
        font-size: 1.05rem;
        line-height: 1.7;
        color: #4b5563;
      }

      .button {
        display: inline-block;
        margin-top: 18px;
        padding: 12px 22px;
        background: #2563eb;
        color: white;
        border-radius: 10px;
        text-decoration: none;
        font-weight: bold;
        transition: background 0.2s ease;
      }

      .button:hover {
        background: #1d4ed8;
      }

      .profile {
        margin-top: 30px;
        padding: 18px 20px;
        background: #eff6ff;
        border-radius: 12px;
      }

      .profile h2 {
        margin: 0 0 16px;
        font-size: 1.35rem;
        color: #111827;
      }

      .profile-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .profile-item {
        padding: 16px;
        background: #ffffff;
        border-radius: 8px;
      }

      .profile-item span {
        display: block;
        margin-bottom: 6px;
        color: #6b7280;
        font-size: 0.85rem;
      }

      .profile-item strong {
        color: #1f2937;
      }

      .eyebrow {
        margin: 0;
        color: #2563eb;
        font-size: 0.9rem;
        font-weight: bold;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      @media (max-width: 600px) {
        .container {
          margin: 32px auto;
          padding: 26px;
        }

        h1 {
          font-size: 2rem;
        }

        .profile-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <p class="eyebrow">Student Portfolio</p>
      <h1>Hi, I'm Md Abul Hasnat</h1>
      <p>
        I am a student in the Computer Science and Engineering (CSE) Department at Southeast
        University.
      </p>

      <a href="#about" class="button">About Me</a>

      <section class="profile" id="about" aria-labelledby="about-heading">
        <h2 id="about-heading">My Academic Profile</h2>
        <div class="profile-grid">
          <div class="profile-item">
            <span>University</span>
            <strong>Southeast University</strong>
          </div>
          <div class="profile-item">
            <span>Department</span>
            <strong>Computer Science and Engineering (CSE)</strong>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
